name: chenille_ai

version: "3.8"

services:
  postgres:
    container_name: chenille_ai_postgres
    image: docker.1ms.run/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      TZ: Asia/Shanghai
    ports:
      - "${DB_PORT:-25432}:5432"
    volumes:
      - ./volumes/chenille_ai/postgres/db_back:/db_back
      - ./volumes/chenille_ai/postgres/data:/var/lib/postgresql/data
    networks:
      - chenille_ai_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: chenille_ai_redis
    restart: unless-stopped
    image: docker.1ms.run/redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-26379}:6379"
    volumes:
      - ./volumes/chenille_ai/redis/data:/data
      - ./volumes/chenille_ai/redis/logs:/var/log/redis
    environment:
      - TZ=Asia/Shanghai
    networks:
      - chenille_ai_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  chenille_ai_network:
    driver: bridge
